[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuldion-engine"
version = "0.1.0"
description = "Headless, adapter-driven AI actor engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
yuldion = "yuldion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
