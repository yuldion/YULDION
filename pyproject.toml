[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuldion-engine"
version = "0.2.0"
description = "Independent headless AI actor engine with replaceable model adapters"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.urls]
Source = "https://github.com/yuldion/YULDION"
Documentation = "https://github.com/yuldion/YULDION/blob/main/docs/pipeline.md"

[project.scripts]
yuldion = "yuldion.cli:main"
yuldion-pipeline = "yuldion.pipeline:main"
yuldion-action-verbs = "yuldion.tools.action_verbs.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
