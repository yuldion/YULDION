[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yuldion-engine"
version = "0.1.0"
description = "Independent headless AI actor engine with replaceable model adapters"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
yuldion = "yuldion.cli:main"
yuldion-action-verbs = "yuldion.tools.action_verbs.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
